<div class="voile" (click)="fermee.emit()"></div>

<aside class="panneau" role="dialog" aria-modal="true" [attr.aria-label]="titre()">
  <header>
    <div class="titres">
      <h2>{{ titre() }}</h2>
      @if (sousTitre()) {
        <p class="muted">{{ sousTitre() }}</p>
      }
    </div>
    <button type="button" class="discret fermer" title="Fermer" (click)="fermee.emit()">×</button>
  </header>

  <div class="corps">
    <ng-content />
  </div>

  @if (libelleSupprimer()) {
    <footer>
      <button type="button" class="discret danger" (click)="supprimee.emit()">
        {{ libelleSupprimer() }}
      </button>
      <button type="button" (click)="fermee.emit()">Fermer</button>
    </footer>
  }
</aside>
