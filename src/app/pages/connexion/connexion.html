<div class="connexion">
  <main class="panneau card">
    <div class="marque">
      <app-logo />
      <p class="baseline muted">Le hub qui organise ton festival.</p>
    </div>

    <div class="champs">
      <label class="champ">
        <span>Ton prenom</span>
        <input
          type="text"
          [value]="prenom()"
          (input)="majTexte(prenom, $event)"
          (keyup.enter)="entrer()"
          placeholder="Antoine"
          autocomplete="given-name"
          autocapitalize="words"
        />
      </label>

      <label class="champ">
        <span>Mot de passe</span>
        <input
          type="password"
          [value]="motDePasse()"
          (input)="majTexte(motDePasse, $event)"
          (keyup.enter)="entrer()"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </label>
    </div>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }

    <button type="button" class="primaire valider" [disabled]="occupe()" (click)="entrer()">
      {{ occupe() ? 'Un instant…' : 'Se connecter' }}
    </button>

    <p class="pied muted">
      Un seul mot de passe pour toute l'equipe. Ton prenom sert a savoir quels invites sont les
      tiens — reprends le meme d'un appareil a l'autre.
    </p>
  </main>
</div>
