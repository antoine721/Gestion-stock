<div class="connexion">
  <section class="card panneau">
    <div class="marque">
      <span class="logo" aria-hidden="true">🎪</span>
      <p class="app-nom">Vialcrm</p>
      <h1>Bienvenue</h1>
      <p class="chapo">
        Le hub qui organise ton festival : invites, budget, courses, missions, DJ.
      </p>
    </div>

    <div class="champs">
      <label class="champ">
        <span>Ton prenom</span>
        <input
          type="text"
          [value]="prenom()"
          (input)="majTexte(prenom, $event)"
          (keyup.enter)="entrer()"
          placeholder="Antoine"
          autocomplete="given-name"
        />
      </label>

      <label class="champ">
        <span>Mot de passe</span>
        <input
          type="password"
          [value]="motDePasse()"
          (input)="majTexte(motDePasse, $event)"
          (keyup.enter)="entrer()"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </label>
    </div>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }

    <button type="button" class="primaire valider" [disabled]="occupe()" (click)="entrer()">
      {{ occupe() ? 'Un instant…' : 'Entrer' }}
    </button>

    <p class="hint">
      Un seul mot de passe pour toute l'equipe. Ton prenom sert a savoir quels invites sont les
      tiens.
    </p>
  </section>
</div>
