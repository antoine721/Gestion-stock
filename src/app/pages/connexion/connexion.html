<div class="connexion">
  <main class="panneau card">
    <div class="marque">
      <app-logo />
      <p class="baseline muted">Le hub qui organise ton festival.</p>
    </div>

    <a class="google" [href]="lienGoogle">
      <svg class="g" viewBox="0 0 18 18" aria-hidden="true">
        <path
          fill="#4285f4"
          d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z"
        />
        <path
          fill="#34a853"
          d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"
        />
        <path
          fill="#fbbc05"
          d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33Z"
        />
        <path
          fill="#ea4335"
          d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"
        />
      </svg>
      Continuer avec Google
    </a>

    @if (erreur()) {
      <p class="erreur">{{ erreur() }}</p>
    }

    @if (repli()) {
      <div class="champs">
        <label class="champ">
          <span>Ton prenom</span>
          <input
            type="text"
            [value]="prenom()"
            (input)="majTexte(prenom, $event)"
            (keyup.enter)="entrer()"
            placeholder="Antoine"
            autocomplete="given-name"
            autocapitalize="words"
          />
        </label>

        <label class="champ">
          <span>Mot de passe</span>
          <input
            type="password"
            [value]="motDePasse()"
            (input)="majTexte(motDePasse, $event)"
            (keyup.enter)="entrer()"
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </label>
      </div>

      <button type="button" class="primaire valider" [disabled]="occupe()" (click)="entrer()">
        {{ occupe() ? 'Un instant…' : 'Se connecter' }}
      </button>
    } @else {
      <button type="button" class="discret secours" (click)="ouvrirRepli()">
        Utiliser le mot de passe de secours
      </button>
    }

    <p class="pied muted">
      L'acces est reserve aux comptes Google de l'equipe d'organisation. Ton prenom vient de ton
      compte : c'est lui qui signe les invites que tu amenes.
    </p>
  </main>
</div>
