<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Vialcrm</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Vialcrm : le hub qui organise ton festival — invites, budget, courses, missions et planning."
    />
    <meta name="theme-color" content="#eef1f6" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Le theme choisi se pose avant le premier rendu, sinon la page clignote. -->
    <script>
      try {
        if (localStorage.getItem('combien-acheter.theme') === 'sombre') {
          document.documentElement.setAttribute('data-theme', 'sombre');
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  </head>

  </body>
</html>
